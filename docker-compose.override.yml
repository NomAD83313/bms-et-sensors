services:
  redlab-collector:
    build:
      context: .
      dockerfile: Dockerfile.redlab # Enables local building for the collector service

  mscl-collector:
    build:
      context: .
      dockerfile: Dockerfile.mscl # Enables local building for the MSCL collector service
    volumes:
      - ./app/mscl:/app
      - ./app/shared/device-common.css:/shared/device-common.css:ro
      # The /app bind mount hides the usb_discovery.py copied into the image.
      - ./app/shared/usb_discovery.py:/shared/usb_discovery.py:ro
    environment:
      # Image default plus /shared for usb_discovery.
      - PYTHONPATH=/usr/lib/python3.12/dist-packages:/shared

  graf-lite:
    build:
      context: .
      dockerfile: Dockerfile.graf-app

  pyrometer-collector:
    build:
      context: .
      dockerfile: Dockerfile.pyrometers

  almemo-collector:
    build:
      context: .
      dockerfile: Dockerfile.almemo

  service-controller:
    build:
      context: .
      dockerfile: Dockerfile.svcctl

  matter-collector:
    build:
      context: .
      dockerfile: Dockerfile.matter-app

  messkluppe-collector:
    build:
      context: .
      dockerfile: Dockerfile.messkluppe

  vibration-collector:
    build:
      context: .
      dockerfile: Dockerfile.vibration
