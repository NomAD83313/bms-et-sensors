# Shared UI, camera selection, and per-camera API/preview routes.
set $pi_camera_probe_backend pi_camera_probe_shared;
set $pi_camera_probe_path /pi/api/status;
location ~ ^/cameras/(.*)$ {
    rewrite ^/cameras/(.*)$ /$1 break;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /cameras/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_pass http://host.docker.internal:8082;
}
